<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#111827">
  <title>Tafelplan 2026</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="stylesheet" href="./styles/main.css">
</head>
<body>
  <header>
    <div class="brand">
      <strong>Tafelplan 2026</strong>
      <span id="saveStatus" class="sync-status">Realtime verbonden</span>
    </div>

    <div class="counters">
      <span class="counter free">Vrij: <b id="freeCount">597</b></span>
      <span class="counter reserved">Gereserveerd: <b id="reservedCount">20</b></span>
      <span class="counter cover">Te dekken: <b id="coverCount">2</b></span>
      <span class="counter occupied">Bezet: <b id="occupiedCount">31</b></span>
      <span class="counter total">Totaal: <b id="totalCount">650</b></span>
    </div>

    <div class="actions">
      <button id="fullBtn" aria-label="Volledig scherm">Volledig scherm</button>
      <button id="adminBtn" aria-label="Beheermodus">🔒 Beheer</button>
    </div>
  </header>

  <div id="adminBar" class="admin-bar" hidden>
    <strong>Beheermodus</strong>
    <button id="addBtn">Stoel toevoegen</button>
    <button id="deleteModeBtn">Stoel verwijderen</button>
    <button id="resetBtn">Alles groen</button>
    <button id="saveLayoutBtn" class="primary">Opslaan</button>
    <button id="cancelAdminBtn">Annuleren</button>
  </div>

  <main>
    <div id="viewport" class="viewport">
      <div id="plan" class="plan">
        <img id="planImage" src="./tafelplan.png" alt="Tafelplan 2026">
        <div id="chairs" class="chairs-layer" aria-label="Aanklikbare stoelen"></div>
      </div>
    </div>
  </main>

  <dialog id="pinDialog" class="pin-dialog">
    <form method="dialog">
      <h2>Beheermodus</h2>
      <label for="pinInput">Pincode</label>
      <input id="pinInput" type="password" inputmode="numeric" maxlength="8" autocomplete="off">
      <p id="pinError" class="error" hidden>Onjuiste pincode.</p>
      <div class="dialog-actions">
        <button type="button" value="cancel">Annuleren</button>
        <button id="pinOk" type="submit" value="default" class="primary">Openen</button>
      </div>
    </form>
  </dialog>

  <script type="module" src="./js/main.js"></script>
</body>
</html>
